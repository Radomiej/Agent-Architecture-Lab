# Run Playwright E2E tests on every PR and on every push to master.
# The workflow status powers the badge in README.md:
#   https://github.com/Radomiej/Agent-Architecture-Lab/actions/workflows/tests.yml/badge.svg
name: Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unit:
    name: Vitest Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-app

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
        working-directory: react-app

  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: react-app

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list,html,junit
        working-directory: react-app
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: react-app/playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-${{ github.run_id }}
          path: react-app/test-results/results.xml
          retention-days: 14
